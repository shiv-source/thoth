root = "."
tmp_dir = "tmp"

[build]
  cmd = "mkdir -p tmp && go build -o ./tmp/main ./cmd/thoth"
  entrypoint = ["./tmp/main", "serve", "--dev"]
  include_ext = ["go", "json", "html"]
  exclude_dir = ["web", "bin", "dist", "tmp", "node_modules", ".git", ".claude", "docs-site"]
  exclude_regex = ["_test\\.go$"]
  kill_delay = 500
  log = "air.log"

[misc]
  clean_on_exit = true
