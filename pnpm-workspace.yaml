packages:
  - web
  - docs-site
  - browser-ext
# Docusaurus's bundler needs @swc/core and core-js postinstall scripts to work;
# esbuild's postinstall installs/verifies its platform binary (the ext's bundler).
allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
# Force patched versions for transitive dev dependencies (docs-site toolchain).
overrides:
  serialize-javascript: 7.1.0
  uuid: 11.1.1
