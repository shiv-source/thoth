name: final-gate
on:
  workflow_call:
    inputs:
      wrapper:
        description: caller job id — excluded from the report alongside this job
        type: string
        required: true
      coverage:
        description: >-
          Total Go backend test coverage % (from quality.yml's backend-test).
          Empty when the backend wasn't touched — the report omits the line.
        type: string
        required: false
      coverage-floor:
        description: >-
          The repo's coverage floor % (Makefile COVERAGE_FLOOR), paired with
          `coverage` for the report's threshold line.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # Single required check for branch protection: runs regardless of the
  # other jobs' outcomes so its step summary always renders the per-job
  # report — then fails unless every other job succeeded or was skipped
  # (skipped = gated off for areas the PR didn't touch, not a failure).
  # All of the logic lives in the ci-report composite action.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: summary + gate
        id: report
        uses: ./.github/actions/ci-report
        with:
          wrapper: ${{ inputs.wrapper }}
          coverage: ${{ inputs.coverage }}
          coverage-floor: ${{ inputs.coverage-floor }}
