name: final-gate
on:
  workflow_call:
    inputs:
      wrapper:
        description: caller job id — excluded from the report alongside this job
        type: string
        required: true

permissions:
  actions: read
  pull-requests: write

jobs:
  # Single required check for branch protection: runs regardless of the
  # other jobs' outcomes so its step summary always renders the per-job
  # report — then fails unless every other job succeeded.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: summary + gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select((.name | split(" / ") | last) != "${{ github.job }}" and (.name | split(" / ") | last) != "${{ inputs.wrapper }}") | {name: (.name | split(" / ") | last), conclusion: .conclusion}]' \
            | jq 'sort_by(.conclusion == "success")')
          failed=$(echo "$jobs" | jq '[.[] | select(.conclusion != "success")] | length')
          if [ "$failed" -gt 0 ]; then
            echo "## CI failed ❌ — $failed job(s) failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI passed ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ github.repository }}#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · commit [\`${GITHUB_SHA:0:8}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$jobs" | jq -r '.[] | . as $j | "| \($j.name) | \((if $j.conclusion == "success" then "✅ success" elif $j.conclusion == "failure" then "❌ failure" elif $j.conclusion == "cancelled" then "🚫 cancelled" elif $j.conclusion == "skipped" then "⏭️ skipped" else "⏳ \($j.conclusion // "in progress")" end)) |"' >> "$GITHUB_STEP_SUMMARY"

          # On PR-triggered runs, mirror the report onto the PR: create or
          # update the bot's marker-tagged comment instead of stacking a new
          # comment per run.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            marker='<!-- thoth-ci-report -->'
            body=$(printf '%s\n\n' "$marker"; cat "$GITHUB_STEP_SUMMARY")
            pr="${{ github.event.pull_request.number }}"
            existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
              --jq '.[] | select(.body | contains("<!-- thoth-ci-report -->")) | .id' | head -1)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
            else
              gh api "repos/${{ github.repository }}/issues/$pr/comments" -f body="$body" > /dev/null
            fi
          fi
          test "$failed" -eq 0
