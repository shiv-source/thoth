name: ci
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # All quality gates, shared verbatim with the PR workflow.
  quality:
    uses: ./.github/workflows/quality.yml

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-web
      - name: build linux targets
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/thoth-linux-amd64 ./cmd/thoth
          GOOS=linux GOARCH=arm64 go build -o /tmp/thoth-linux-arm64 ./cmd/thoth

  build-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-web
      - name: build darwin targets
        shell: bash
        run: |
          GOOS=darwin GOARCH=amd64 go build -o /tmp/thoth-darwin-amd64 ./cmd/thoth
          GOOS=darwin GOARCH=arm64 go build -o /tmp/thoth-darwin-arm64 ./cmd/thoth

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-web
      - name: build windows target
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go build -o /tmp/thoth-windows-amd64.exe ./cmd/thoth

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm run build

  # Builds the Docusaurus docs site only when docs-site/ changed in this push;
  # otherwise the job skips (docs/ content is rendered by the same site, and a
  # docs-only change still needs the site to compile — see quality.yml docs-build).
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: skip unless docs-site changed
        id: changes
        shell: bash
        run: |
          base="${{ github.event.before }}"
          changed=false
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif git diff --name-only "$base...${{ github.sha }}" | grep -q '^docs-site/'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-web
        if: steps.changes.outputs.changed == 'true'
      - run: pnpm --filter thoth-docs build
        if: steps.changes.outputs.changed == 'true'

  # Single required check for branch protection — see final-gate.yml.
  final-gate:
    needs: [quality, frontend-build, docs-build, build-linux, build-darwin, build-windows]
    if: always()
    uses: ./.github/workflows/final-gate.yml
    with:
      wrapper: final-gate
      coverage: ${{ needs.quality.outputs.coverage }}
      coverage-floor: ${{ needs.quality.outputs.coverage_floor }}
      web-coverage: ${{ needs.quality.outputs.web_coverage }}
      web-coverage-floor: ${{ needs.quality.outputs.web_coverage_floor }}
