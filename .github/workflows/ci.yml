name: ci
# Consolidated CI for push, PR, and manual runs. All gates (Go + the two Node
# targets + security/secret-scan/codespell/actionlint) are configured in
# .github/golden-path.yaml and driven by the golden-path-ci reusable workflow;
# thoth maintains no CI logic of its own. The aggregate is a single required
# check, and the gate report is posted/upserted on PRs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-path:
    uses: shiv-source/golden-path/.github/workflows/golden-path-ci.yaml@main
    with:
      config-path: .github/golden-path.yaml
      pr-comment: true
    secrets: inherit
