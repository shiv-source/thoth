name: ci
# Consolidated CI for push, PR, and manual runs. Language gates and universal
# quality checks live in the golden-path reusable workflows, so thoth never
# maintains its own CI copies. The final-gate aggregates every gate into a
# single required check and posts the rich report as a PR comment.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Read-only checkout; each called reusable workflow declares its own elevated
# permissions (security-scan carries security-events: write internally).
permissions:
  contents: read

jobs:
  # Go backend + universal quality checks (security scan, secret scan,
  # codespell, actionlint) via the code-quality umbrella. setup-command builds
  # the embedded frontend (internal/webui/dist), which the webui tests require,
  # and test-args mirrors the Makefile's COVER_PKGS scope. The two node targets
  # stay as direct build-test-node calls because code-quality's single node
  # gate cannot express web + browser-ext with their own coverage gates.
  code-quality:
    uses: shiv-source/golden-path/.github/workflows/code-quality.yaml@main
    with:
      go: true
      node: false
      go-version-file: go.mod
      working-directory: .
      coverage-floor: 90
      cross-compile: true
      change-detection: true
      change-paths: '["**/*.go","go.mod","go.sum",".golangci.yml",".github/","web/**","package.json","pnpm-lock.yaml","pnpm-workspace.yaml"]'
      golangci-lint-version: v2.12.2
      golangci-lint-config: .golangci.yml
      golangci-lint-timeout: 5m
      # corepack pins pnpm to the version docs/development.md requires (lockfile
      # is v9), then `make web` syncs the built frontend into the Go embed.
      setup-command: 'corepack enable && corepack prepare pnpm@11.7.0 --activate && make web'
      test-args: '-race -failfast -coverprofile=coverage.out ./agent/... ./internal/... ./cmd/...'

  # Frontend (web/): lint, typecheck, build, and a coverage-gated test run.
  web:
    uses: shiv-source/golden-path/.github/workflows/build-test-node.yaml@main
    with:
      working-directory: .
      node-version: '24'
      package-manager: pnpm
      shard-count: 1
      lint-command: pnpm run lint
      typecheck-command: pnpm run typecheck
      test-command: pnpm run test
      build-command: pnpm run build
      coverage-command: pnpm run test:coverage
      coverage-floor: 90
      coverage-summary-path: web/coverage/coverage-summary.json
      change-detection: true
      change-paths: '["web/**","package.json","pnpm-lock.yaml","pnpm-workspace.yaml"]'

  # Browser extension (browser-ext/): lint, typecheck, test, build.
  ext:
    uses: shiv-source/golden-path/.github/workflows/build-test-node.yaml@main
    with:
      working-directory: .
      node-version: '24'
      package-manager: pnpm
      shard-count: 1
      lint-command: pnpm --filter thoth-ext lint
      typecheck-command: pnpm --filter thoth-ext typecheck
      test-command: pnpm --filter thoth-ext test
      build-command: pnpm --filter thoth-ext build
      change-detection: true
      change-paths: '["browser-ext/**","package.json","pnpm-lock.yaml","pnpm-workspace.yaml"]'

  # Single required check for branch protection: aggregates every gate, renders
  # the coverage + job report, and upserts the PR comment. Skipped gates (from
  # change detection) count as passing.
  final-gate:
    needs: [code-quality, web, ext]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: shiv-source/golden-path/.github/actions/final-gate@main
        with:
          results: ${{ format('code-quality={0} web={1} ext={2}', needs.code-quality.result, needs.web.result, needs.ext.result) }}
          coverage: ${{ needs.code-quality.outputs.coverage }}
          coverage-floor: ${{ needs.code-quality.outputs.coverage_floor }}
          web-coverage: ${{ needs.web.outputs.coverage }}
          web-coverage-floor: ${{ needs.web.outputs.coverage_floor }}
          pr-comment: true
