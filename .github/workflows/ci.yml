name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-web
      - run: go vet ./...
      - run: go test -race ./...
      - name: coverage gate (>= 80% on internal/ and cmd/)
        run: |
          go test -coverprofile=coverage.out ./internal/... ./cmd/...
          go tool cover -func=coverage.out | awk -F'\t' '/^total:/ { gsub(/%/, "", $NF); if ($NF+0 < 80) { print "coverage", $NF "%", "below 80% floor"; exit 1 } }'

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-web
      - name: golangci-lint v2.12.2 (direct binary)
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.tool_cache }}/golangci-lint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz | tar xz -C "$HOME/.local/bin"
          ln -sf "$HOME/.local/bin/golangci-lint-2.12.2-linux-amd64/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          golangci-lint --version
          golangci-lint run --timeout 5m

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test, backend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-web
      - name: build linux targets
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/thoth-linux-amd64 ./cmd/thoth
          GOOS=linux GOARCH=arm64 go build -o /tmp/thoth-linux-arm64 ./cmd/thoth

  build-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [backend-test, backend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-web
      - name: build darwin targets
        shell: bash
        run: |
          GOOS=darwin GOARCH=amd64 go build -o /tmp/thoth-darwin-amd64 ./cmd/thoth
          GOOS=darwin GOARCH=arm64 go build -o /tmp/thoth-darwin-arm64 ./cmd/thoth

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [backend-test, backend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-web
      - name: build windows target
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go build -o /tmp/thoth-windows-amd64.exe ./cmd/thoth

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm exec vitest run

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm exec tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-test, frontend-lint, frontend-typecheck]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm run build

  # Single required check for branch protection: runs regardless of the
  # other jobs' outcomes (if: always) so its step summary always renders the
  # per-job report — then fails the job itself unless every job succeeded.
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    needs: [backend-test, backend-lint, build-linux, build-darwin, build-windows, frontend-test, frontend-lint, frontend-typecheck, frontend-build]
    if: always()
    steps:
      - name: summary + gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.name != "${{ github.job }}") | {name: .name, conclusion: .conclusion}]')
          failed=$(echo "$jobs" | jq '[.[] | select(.conclusion != "success")] | length')
          if [ "$failed" -gt 0 ]; then
            echo "## CI failed ❌" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI passed ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ github.repository }}#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$jobs" | jq -r '.[] | "| \(.name) | \(.conclusion) |"' >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
