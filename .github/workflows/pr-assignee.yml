name: pr-assignee
# Auto-assign every PR to its author and all commit authors (add-only, never
# replaces manual assignments). Runs on every PR — never gated on changed
# files. Convenience only: it never fails the run.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    uses: shiv-source/golden-path/.github/workflows/pr-assignee.yaml@main
