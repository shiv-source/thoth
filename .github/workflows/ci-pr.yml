name: ci-pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  # Default assignee: whoever created the PR. Runs on every PR — never gated
  # on changed files (auto-assignment is required regardless of the diff).
  assignee:
    uses: ./.github/workflows/pr-assignee.yml

  # Minimal pre-merge feedback: the same quality gates that run on main
  # (via the shared workflow), without the OS builds. Path-aware inside the
  # shared workflow — quality.yml's own changes job skips the gates for
  # areas the PR didn't touch, so a docs-only PR runs none of them.
  quality:
    uses: ./.github/workflows/quality.yml

  # Single required check for PRs — same gate as main (final-gate.yml).
  # Always runs so the branch-protection check is always reported, and it
  # treats skipped gates as passing (final-gate.yml).
  final-gate:
    needs: [quality]
    if: always()
    uses: ./.github/workflows/final-gate.yml
    with:
      wrapper: final-gate
      coverage: ${{ needs.quality.outputs.coverage }}
      coverage-floor: ${{ needs.quality.outputs.coverage_floor }}
      coverage-covered: ${{ needs.quality.outputs.coverage_covered }}
      coverage-total: ${{ needs.quality.outputs.coverage_total }}
      web-coverage: ${{ needs.quality.outputs.web_coverage }}
      web-coverage-floor: ${{ needs.quality.outputs.web_coverage_floor }}
      web-coverage-covered: ${{ needs.quality.outputs.web_coverage_covered }}
      web-coverage-total: ${{ needs.quality.outputs.web_coverage_total }}
