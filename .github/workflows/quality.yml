name: quality
on:
  workflow_call:
    inputs:
      backend:
        description: run the Go gates (backend-test, backend-lint)
        type: boolean
        default: true
      frontend:
        description: run the TS gates (frontend-test, frontend-lint, frontend-typecheck)
        type: boolean
        default: true
      graph:
        description: run the graph freshness gate (graph-check)
        type: boolean
        default: true
      issue_labels:
        description: run the issue-labels action test suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The committed graph must match the committed tree — a PR that changed
  # Go/TS without refreshing the graph fails here (scripts/graph-check.sh).
  graph-check:
    if: inputs.graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/graph-check.sh

  backend-test:
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-web
      - run: go vet ./...
      - run: go test -race -failfast ./...
      - name: coverage gate (>= 80% on internal/ and cmd/)
        run: make cover

  backend-lint:
    if: inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-web
      # golangci-lint keeps its analysis cache here; runner.tool_cache does
      # not persist on hosted runners, so cache it (plus the downloaded
      # binary) explicitly. The version is in the key so upgrades miss.
      - name: cache golangci-lint results and binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.local/bin/golangci-lint-2.12.2-linux-amd64
          key: golangci-lint-2.12.2-${{ hashFiles('.golangci.yml') }}
      - name: golangci-lint v2.12.2 (direct binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          bin="$HOME/.local/bin/golangci-lint-2.12.2-linux-amd64/golangci-lint"
          if [ ! -x "$bin" ]; then
            curl -sSL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz | tar xz -C "$HOME/.local/bin"
          fi
          ln -sf "$bin" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          golangci-lint --version
          golangci-lint run --timeout 5m

  frontend-test:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm exec vitest run

  frontend-lint:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm run lint

  frontend-typecheck:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm exec tsc --noEmit

  issue-labels-test:
    if: inputs.issue_labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node --test .github/actions/issue-labels/test/*.test.mjs
