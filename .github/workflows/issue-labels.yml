name: issue-labels
# Auto-apply the three-tier issue labels (type, priority, areas) from the
# issue form answers. Add-only: the action never removes a label. The bundled
# golden-path default config matches thoth's form headings; to customize, pass
# a repo-local config via the golden-path issue-labels workflow `config` input.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  apply:
    uses: shiv-source/golden-path/.github/workflows/issue-labels.yaml@main
