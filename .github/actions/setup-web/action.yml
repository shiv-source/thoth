name: setup-web
description: Node/pnpm toolchain + frozen install (shared CI preamble for frontend jobs; runs after checkout)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: latest
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      working-directory: web
      shell: bash
