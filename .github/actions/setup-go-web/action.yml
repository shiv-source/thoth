name: setup-go-web
description: Go/Node toolchain + frontend embed build (shared CI preamble for Go jobs; runs after checkout)

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: pnpm/action-setup@v6
      with:
        version: latest
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: make web
      shell: bash
