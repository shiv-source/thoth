name: issue-labels
description: >-
  Apply the three-tier issue labels (type, priority, areas) from issue-form
  answers. Add-only — it never removes labels, so user-applied extras survive.
  Parsing is whitelist-driven (see config.json): a body can never inject a
  label that is not in the configured set.

inputs:
  token:
    description: >-
      Token with issues: write permission (issue labels live on the issues
      API). Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  config:
    description: >-
      Path, relative to this action's directory, of the label-set + field-map
      JSON (config.json by default). Copy/point this at a different file to
      reuse the action with another label set.
    required: false
    default: config.json

outputs:
  applied:
    description: JSON array of the labels this run added ([] when nothing to add).
    value: ${{ steps.apply.outputs.applied }}

runs:
  using: composite
  steps:
    - name: Apply issue-form labels
      id: apply
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LABELS_CONFIG: ${{ inputs.config }}
      run: node "${{ github.action_path }}/src/index.mjs"
